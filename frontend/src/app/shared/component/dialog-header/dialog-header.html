 <div class="w-full">

      <!-- LEFT: TITLE -->
        <div class="flex justify-content-between align-items-center w-full">
            <div class="flex align-items-center gap-3">
                <p-chip
                    [image]="user?.profilePic || null"
                    [icon]="!user?.profilePic ? 'pi pi-user' : ''"
                    [label]="user?.name"
                    (onImageError)="user.profilePic = null">
                </p-chip>
                <!-- <div>
                    <i class="{{icon}} text-primary text-2xl mb-2"></i>
                    <h2>{{title}}</h2>
                </div> -->
            </div>

            <!-- CLOSE ICON -->
            <button
            pButton
            icon="pi pi-times"
            class="p-button-text p-button-rounded p-button-sm"
            (click)="ref.close(null)">
            </button>
        </div>
    </div>
