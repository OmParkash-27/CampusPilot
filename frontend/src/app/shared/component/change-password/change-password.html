<div class="dialog-container flex flex-column h-full">

  <!-- 🔷 HEADER -->
  <div class="dialog-header text-center">
    <i class="pi pi-shield text-primary text-2xl mb-2"></i>
    <h3 class="m-0">Change Password</h3>
    <p class="text-sm text-color-secondary m-0">
      Update your account password securely
    </p>
  </div>

  <!-- 🔷 CONTENT -->
  <div class="dialog-body flex-1">
    <form [formGroup]="passwordForm" class="p-fluid">

      <!-- Old Password -->
      <p-inputGroup class="mb-3">
        <p-inputGroupAddon><i class="pi pi-key"></i></p-inputGroupAddon>
        <input
          type="password"
          pInputText
          placeholder="Old Password"
          formControlName="oldPassword"
          [ngClass]="{ 'p-invalid': passwordForm.get('oldPassword')?.touched && passwordForm.get('oldPassword')?.invalid }"
        />
      </p-inputGroup>
      <small class="p-error"
        *ngIf="passwordForm.get('oldPassword')?.touched && passwordForm.get('oldPassword')?.invalid">
        Old password is required
      </small>

      <!-- New Password -->
      <p-inputGroup class="mb-3 mt-3">
        <p-inputGroupAddon><i class="pi pi-lock"></i></p-inputGroupAddon>
        <input
          type="password"
          pInputText
          placeholder="New Password"
          formControlName="newPassword"
          [ngClass]="{ 'p-invalid': passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid }"
        />
      </p-inputGroup>
      <small class="p-error"
        *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid">
        Minimum 6 characters required
      </small>

      <!-- Confirm Password -->
      <p-inputGroup class="mb-2 mt-3">
        <p-inputGroupAddon><i class="pi pi-check"></i></p-inputGroupAddon>
        <input
          type="password"
          pInputText
          placeholder="Confirm Password"
          formControlName="confirmPassword"
        />
      </p-inputGroup>

      <!-- Match Error -->
      <small class="p-error"
        *ngIf="passwordForm.value.newPassword !== passwordForm.value.confirmPassword">
        Passwords do not match
      </small>

    </form>
  </div>

</div>
